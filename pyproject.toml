[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-health"
version = "1.0.0"
description = "Cross-platform battery health checker."
readme = "README.md"
# tomllib (stdlib, 3.11+) is used by scripts/build.py to read the version below.
requires-python = ">=3.11"
# The checker shells out to platform tools (powercfg, upower, ioreg) and parses
# their output, so it runs on the standard library alone.
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
battery-health = "battery_health:main"

[tool.setuptools]
py-modules = ["battery_health"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "release", "__pycache__"]

[tool.ruff.lint]
# pycodestyle + pyflakes + import sorting: the flake8 rules this project used,
# without pulling in restyling rules that would rewrite existing annotations.
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "^(release|build|dist)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
